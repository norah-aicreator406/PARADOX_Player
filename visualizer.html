<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PARADOX Visualizer</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: system-ui, sans-serif;
}



#stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  color: #fff;

  --bass: 0;
  --mid: 0;
  --high: 0;
  --master: 0;

  --cyan: #7cfbff;
  --cyan-soft: rgba(124, 251, 255, 0.42);
  --blue: #2f7bff;
  --blue-soft: rgba(47, 123, 255, 0.34);
  --pink: #ff4fd8;
  --pink-soft: rgba(255, 79, 216, 0.28);

  background:
    radial-gradient(circle at 50% 42%, rgba(124,251,255,0.10), transparent 34%),
    radial-gradient(circle at 20% 28%, rgba(255,79,216,0.10), transparent 20%),
    radial-gradient(circle at 80% 34%, rgba(47,123,255,0.12), transparent 24%),
    linear-gradient(180deg, #02040a 0%, #050913 48%, #000000 100%);
}


#visualCircle {
  position: absolute;
  left: 50%;
  top: 39%;
  width: 270px;
  height: 270px;
  border-radius: 50%;
  border: 2px solid rgba(124,251,255, calc(0.54 + var(--master) * 0.28));
  transform: translate(-50%, -50%) scale(calc(0.92 + var(--bass) * 0.24));
  box-shadow:
    0 0 calc(20px + var(--bass) * 42px) rgba(124,251,255, calc(0.36 + var(--master) * 0.28)),
    0 0 calc(46px + var(--master) * 54px) rgba(47,123,255, calc(0.16 + var(--master) * 0.18)),
    0 0 calc(72px + var(--high) * 34px) rgba(255,79,216, calc(0.10 + var(--high) * 0.12)),
    inset 0 0 calc(18px + var(--bass) * 30px) rgba(124,251,255, calc(0.12 + var(--bass) * 0.12));
  opacity: calc(0.78 + var(--master) * 0.16);
  z-index: 3;
  transition:
    transform 0.07s linear,
    box-shadow 0.07s linear,
    border-color 0.07s linear,
    opacity 0.07s linear;
}

#visualCircle::before {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255, calc(0.12 + var(--high) * 0.35));
  box-shadow:
    0 0 calc(12px + var(--high) * 38px) rgba(255,255,255, calc(0.10 + var(--high) * 0.30));
  opacity: calc(0.36 + var(--high) * 0.50);
  transform: scale(calc(0.94 + var(--high) * 0.18));
  transition: transform 0.06s linear, opacity 0.06s linear, box-shadow 0.06s linear;
}

#visualCircle::after {
  content: "";
  position: absolute;
  inset: -8%;
  border-radius: 50%;
  border: 1px dashed rgba(0,255,204, calc(0.18 + var(--mid) * 0.26));
  opacity: calc(0.28 + var(--mid) * 0.42);
  transform: rotate(calc(var(--high) * 16deg));
  transition: transform 0.08s linear, opacity 0.08s linear;
}



#bars {
  position: absolute;
  left: 50%;
  bottom: 125px;
  transform: translateX(-50%);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 6px;
  width: 82%;
  height: 165px;
  z-index: 2;
}

.bar {
  --bar-level: 0;

  border-radius: 999px;
  transform-origin: bottom;
  opacity: calc(0.34 + var(--bar-level) * 0.66);
  transition:
    height 0.06s linear,
    opacity 0.06s linear,
    box-shadow 0.06s linear;
}

.bass-bar {
  width: 12px;
  height: calc(22px + var(--bar-level) * 132px);
  background: linear-gradient(180deg, #e8ffff 0%, #7cfbff 40%, #2f7bff 100%);
  box-shadow: 0 0 18px rgba(47,123,255,0.35);
}

.mid-bar {
  width: 8px;
  height: calc(16px + var(--bar-level) * 124px);
  background: linear-gradient(180deg, #ffffff 0%, #7cfbff 46%, #2f7bff 100%);
  box-shadow: 0 0 16px rgba(124,251,255,0.34);
}

.high-bar {
  width: 5px;
  height: calc(10px + var(--bar-level) * 108px);
  background: linear-gradient(180deg, #ffffff 0%, #7cfbff 38%, #ff4fd8 100%);
  box-shadow: 0 0 16px rgba(255,79,216,0.30);
}

#songInfo {
  position: absolute;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%);
  z-index: 4;
  width: 78%;
  text-align: center;
  pointer-events: none;
}

#title {
  font-size: 32px;
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: 0.01em;
  color: #ffffff;
  text-shadow:
    0 0 10px rgba(255,255,255,0.28),
    0 0 24px rgba(0,255,204,0.38);
}

#artist {
  margin-top: 10px;
  font-size: 17px;
  font-weight: 700;
  color: #00ffcc;
  text-shadow:
    0 0 10px rgba(0,255,204,0.65),
    0 0 22px rgba(0,255,204,0.28);
}

#brand {
  position: absolute;
  top: 42px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.30em;
  color: rgba(255,255,255,0.88);
  text-shadow:
    0 0 10px rgba(0,255,204,0.30),
    0 0 22px rgba(0,255,204,0.18);
  white-space: nowrap;
}

@keyframes pulse {
  0%, 100% {
    transform: translate(-50%, -50%) scale(0.96);
    opacity: 0.72;
  }
  50% {
    transform: translate(-50%, -50%) scale(1.04);
    opacity: 1;
  }
}

@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes barMove {
  0%, 100% { height: 28px; opacity: 0.45; }
  50% { height: 115px; opacity: 1; }
}

#bgImage {
  display: none;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  opacity: 0.62;
  filter: contrast(1.06) saturate(1.05) brightness(0.78);
}

#bgOverlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 40%, rgba(0,255,204,0.12), transparent 38%),
    radial-gradient(circle at 50% 100%, rgba(0,0,0,0.82), transparent 38%),
    linear-gradient(180deg, rgba(0,0,0,0.42), rgba(0,0,0,0.86));
}

#bgOverlay::before {
  content: "";
  position: absolute;
  inset: -28%;
  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(0,255,204, calc(0.16 + var(--master) * 0.34)),
      rgba(0,255,204, calc(0.05 + var(--bass) * 0.24)) 18%,
      transparent calc(32% + var(--bass) * 22%)
    );
  filter: blur(calc(18px + var(--bass) * 48px));
  opacity: calc(0.50 + var(--master) * 0.50);
  transform: scale(calc(0.95 + var(--bass) * 0.18));
  transition: opacity 0.07s linear, transform 0.07s linear, filter 0.07s linear;
}

#bgOverlay::after {
  content: "";
  position: absolute;
  inset: -12%;
  background:
    radial-gradient(circle at 18% 30%, rgba(255,79,216, calc(0.10 + var(--high) * 0.18)), transparent 20%),
    radial-gradient(circle at 82% 34%, rgba(47,123,255, calc(0.12 + var(--mid) * 0.18)), transparent 24%),
    radial-gradient(circle at 50% 84%, rgba(124,251,255, calc(0.08 + var(--bass) * 0.16)), transparent 24%);
  opacity: calc(0.24 + var(--high) * 0.42);
  filter: blur(calc(10px + var(--high) * 18px));
  transition: opacity 0.07s linear, filter 0.07s linear;
}

#bgVideo {
  display: none;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  opacity: 0.72;
  filter: contrast(1.06) saturate(1.08) brightness(0.84);
}

#stage.visualizer-off #visualCircle,
#stage.visualizer-off #bars,
#stage.visualizer-off #bandLabels {
  display: none;
}

#stage.visualizer-off #bgOverlay::before,
#stage.visualizer-off #bgOverlay::after {
  opacity: 0;
}

#stage.visualizer-off #bgOverlay {
  background:
    linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.72));
}

#bandLabels {
  position: absolute;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%);
  width: 74%;
  display: grid;
  grid-template-columns: 1fr 1.7fr 1fr;
  z-index: 3;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.16em;
  color: rgba(0,255,204,0.86);
  text-align: center;
  text-shadow: 0 0 10px rgba(0,255,204,0.55);
}

#circleAura {
  position: absolute;
  left: 50%;
  top: 39%;
  width: 390px;
  height: 390px;
  transform: translate(-50%, -50%) scale(calc(0.94 + var(--bass) * 0.14));
  border-radius: 50%;
  z-index: 2;
  pointer-events: none;
  opacity: calc(0.34 + var(--master) * 0.36);
  filter: blur(calc(20px + var(--bass) * 12px));
  transition:
    transform 0.08s linear,
    opacity 0.08s linear,
    filter 0.08s linear;
  mix-blend-mode: screen;
}

#circleAura::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(circle at center,
      rgba(124,251,255,0.00) 44%,
      rgba(124,251,255, calc(0.18 + var(--master) * 0.18)) 54%,
      rgba(47,123,255, calc(0.14 + var(--mid) * 0.14)) 60%,
      rgba(255,79,216, calc(0.10 + var(--high) * 0.12)) 66%,
      rgba(124,251,255,0.00) 77%
    );
  filter: blur(16px);
  opacity: calc(0.56 + var(--master) * 0.28);
}

#circleAura::after {
  content: "";
  position: absolute;
  inset: -10%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 28% 36%, rgba(255,79,216,0.18), transparent 18%),
    radial-gradient(circle at 72% 28%, rgba(47,123,255,0.22), transparent 20%),
    radial-gradient(circle at 50% 72%, rgba(124,251,255,0.20), transparent 18%);
  filter: blur(24px);
  opacity: calc(0.20 + var(--high) * 0.24);
}

@keyframes auraFloat {
  0% {
    transform: scale(0.98) rotate(0deg);
    opacity: 0.20;
  }
  50% {
    transform: scale(1.03) rotate(8deg);
    opacity: 0.34;
  }
  100% {
    transform: scale(0.98) rotate(0deg);
    opacity: 0.20;
  }
}

#ringBurst {
  position: absolute;
  left: 50%;
  top: 39%;
  width: 420px;
  height: 420px;
  transform: translate(-50%, -50%) scale(calc(0.92 + var(--master) * 0.16));
  border-radius: 50%;
  z-index: 1;
  pointer-events: none;
  opacity: calc(0.42 + var(--master) * 0.34);
  filter: blur(2px);
  transition: transform 0.08s linear, opacity 0.08s linear;
  mix-blend-mode: screen;
}

#ringBurst::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    conic-gradient(
      from 0deg,
      transparent 0deg 8deg,
      rgba(124,251,255,0.90) 8deg 18deg,
      transparent 18deg 32deg,
      rgba(47,123,255,0.82) 32deg 44deg,
      transparent 44deg 60deg,
      rgba(255,79,216,0.72) 60deg 70deg,
      transparent 70deg 95deg,
      rgba(124,251,255,0.88) 95deg 108deg,
      transparent 108deg 130deg,
      rgba(47,123,255,0.78) 130deg 146deg,
      transparent 146deg 176deg,
      rgba(255,79,216,0.74) 176deg 188deg,
      transparent 188deg 220deg,
      rgba(124,251,255,0.86) 220deg 235deg,
      transparent 235deg 260deg,
      rgba(47,123,255,0.76) 260deg 274deg,
      transparent 274deg 302deg,
      rgba(255,79,216,0.74) 302deg 314deg,
      transparent 314deg 340deg,
      rgba(124,251,255,0.84) 340deg 352deg,
      transparent 352deg 360deg
    );
  -webkit-mask: radial-gradient(circle, transparent 0 47%, #000 56%, transparent 73%);
  mask: radial-gradient(circle, transparent 0 47%, #000 56%, transparent 73%);
  filter: blur(7px);
  opacity: calc(0.42 + var(--high) * 0.46);
}

#ringBurst::after {
  content: "";
  position: absolute;
  inset: -6%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, transparent 44%, rgba(124,251,255,0.26) 56%, transparent 72%),
    radial-gradient(circle at 34% 42%, rgba(255,79,216,0.20), transparent 18%),
    radial-gradient(circle at 72% 36%, rgba(47,123,255,0.24), transparent 20%),
    radial-gradient(circle at 56% 76%, rgba(124,251,255,0.18), transparent 18%);
  filter: blur(18px);
  opacity: calc(0.24 + var(--master) * 0.34);
  animation: ringBurstFloat 5.5s ease-in-out infinite;
}

@keyframes ringBurstFloat {
  0% {
    transform: scale(0.98) rotate(0deg);
  }
  50% {
    transform: scale(1.03) rotate(8deg);
  }
  100% {
    transform: scale(0.98) rotate(0deg);
  }
}



</style>
</head>

<body>
  <div id="stage" class="template-standard">
  <video id="bgVideo" playsinline></video>
  <img id="bgImage" src="">
  <div id="bgOverlay"></div>

  <div id="brand">VISUALIZER</div>

    <div id="ringBurst"></div>
<div id="circleAura"></div>
<div id="visualCircle"></div>

    <div id="bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

        <div id="songInfo">
      <div id="title">再生待機中</div>
      <div id="artist">PARADOX Player</div>
    </div>

    <div id="bandLabels">
      <span>LOW</span>
      <span>MID</span>
      <span>HIGH</span>
    </div>
  </div>

<script>

  const BAR_COUNT = 30;

function createVisualizerBars() {
  const barsContainer = document.getElementById('bars');
  if (!barsContainer) return;

  barsContainer.innerHTML = '';

  for (let i = 0; i < BAR_COUNT; i++) {
    const bar = document.createElement('div');

    if (i < 6) {
      bar.className = 'bar bass-bar';
    } else if (i < 20) {
      bar.className = 'bar mid-bar';
    } else {
      bar.className = 'bar high-bar';
    }

    bar.style.setProperty('--bar-level', 0);
    bar.style.setProperty('--bar-delay', `${i * 0.012}s`);

    barsContainer.appendChild(bar);
  }
}

createVisualizerBars();


const { ipcRenderer } = require('electron');

ipcRenderer.on('visualizer-song', (event, song) => {
  document.getElementById('title').textContent = song.title || '再生待機中';
  document.getElementById('artist').textContent = song.artist || 'PARADOX Player';

  const bgVideo = document.getElementById('bgVideo');
  const bgImage = document.getElementById('bgImage');

  if (song.mediaType === 'video') {
  bgVideo.pause();
  bgVideo.src = song.fileUrl;
  bgVideo.style.display = 'block';
  bgVideo.muted = false;
  bgVideo.volume = 1;

  bgImage.style.display = 'none';
  bgImage.src = '';

  setupVideoAnalyzer();

  if (videoAudioContext.state === 'suspended') {
    videoAudioContext.resume();
  }

  bgVideo.play().then(() => {
    startVideoVisualizerLevelLoop();
  }).catch(error => {
    console.error('動画を再生できませんでした:', error);
  });

  return;
}

  bgVideo.pause();
  bgVideo.removeAttribute('src');
  bgVideo.load();
  bgVideo.style.display = 'none';
});

ipcRenderer.on('visualizer-background', (event, background) => {
  const bgImage = document.getElementById('bgImage');
  const bgVideo = document.getElementById('bgVideo');

  if (bgVideo.style.display === 'block') {
    return;
  }

  if (!background || !background.fileUrl) {
    bgImage.style.display = 'none';
    bgImage.src = '';
    return;
  }

  bgImage.src = background.fileUrl;
  bgImage.style.display = 'block';
});

const bgVideo = document.getElementById('bgVideo');

bgVideo.addEventListener('ended', () => {
  stopVideoVisualizerLevelLoop();
  ipcRenderer.invoke('visualizer-video-ended');
});

ipcRenderer.on('visualizer-stop-video', () => {
  stopVideoVisualizerLevelLoop();

  bgVideo.pause();
  bgVideo.currentTime = 0;
  bgVideo.removeAttribute('src');
  bgVideo.load();
  bgVideo.style.display = 'none';
});

function clampLevel(value) {
  return Math.max(0, Math.min(1, Number(value) || 0));
}

ipcRenderer.on('visualizer-level', (event, visualizerData) => {
  const stage = document.getElementById('stage');
  const bars = document.querySelectorAll('.bar');

  // 古い level 1個方式にも一応対応
  if (typeof visualizerData === 'number') {
    const level = clampLevel(visualizerData);

    stage.style.setProperty('--bass', level);
    stage.style.setProperty('--mid', level);
    stage.style.setProperty('--high', level);
    stage.style.setProperty('--master', level);

    bars.forEach(bar => {
      bar.style.setProperty('--bar-level', level);
    });

    return;
  }

  const bass = clampLevel(visualizerData?.bass);
  const mid = clampLevel(visualizerData?.mid);
  const high = clampLevel(visualizerData?.high);
  const master = clampLevel(visualizerData?.master);
  const barValues = Array.isArray(visualizerData?.bars) ? visualizerData.bars : [];

  stage.style.setProperty('--bass', bass);
  stage.style.setProperty('--mid', mid);
  stage.style.setProperty('--high', high);
  stage.style.setProperty('--master', master);

  bars.forEach((bar, index) => {
    const value = clampLevel(barValues[index]);

    bar.style.setProperty('--bar-level', value);
  });
});

function setupVideoAnalyzer() {
  const bgVideo = document.getElementById('bgVideo');

  if (videoAudioContext && videoAnalyser) return;

  videoAudioContext = new AudioContext();

  videoAnalyser = videoAudioContext.createAnalyser();
  videoAnalyser.fftSize = 256;

  videoAnalyserDataArray = new Uint8Array(videoAnalyser.frequencyBinCount);

  videoSourceNode = videoAudioContext.createMediaElementSource(bgVideo);
  videoSourceNode.connect(videoAnalyser);
  videoAnalyser.connect(videoAudioContext.destination);
}

function averageRange(array, start, end) {
  const safeStart = Math.max(0, start);
  const safeEnd = Math.min(array.length, end);

  if (safeEnd <= safeStart) return 0;

  let sum = 0;

  for (let i = safeStart; i < safeEnd; i++) {
    sum += array[i];
  }

  return sum / (safeEnd - safeStart);
}

function normalizeAudioValue(value, sensitivity = 220, curve = 0.75) {
  const normalized = Math.max(0, Math.min(1, value / sensitivity));

  return Math.pow(normalized, curve);
}

function createVisualizerData(array) {
  const bassRaw = averageRange(array, 1, 8);
  const midRaw = averageRange(array, 8, 42);
  const highRaw = averageRange(array, 42, 115);
  const masterRaw = averageRange(array, 1, 115);

  const bass = normalizeAudioValue(bassRaw, 230, 0.85);
  const mid = normalizeAudioValue(midRaw, 215, 0.82);
  const high = normalizeAudioValue(highRaw, 205, 0.78);
  const master = normalizeAudioValue(masterRaw, 225, 0.86);

  const barCount = 30;
  const bars = [];

  for (let i = 0; i < barCount; i++) {
    let start;
    let end;
    let sensitivity;
    let boost;

    if (i < 6) {
      // 左：低音 6本。動画でも張り付きやすいので抑える
      const localIndex = i;
      start = 1 + localIndex * 2;
      end = start + 3;
      sensitivity = 250;
      boost = 0.82;
    } else if (i < 20) {
      // 中央：中音 14本
      const localIndex = i - 6;
      start = 8 + localIndex * 2;
      end = start + 4;
      sensitivity = 225;
      boost = 0.92;
    } else {
      // 右：高音 10本
      const localIndex = i - 20;
      start = 42 + localIndex * 5;
      end = start + 8;
      sensitivity = 210;
      boost = 1.05;
    }

    const raw = averageRange(array, start, end);
    const variation = 0.72 + (Math.sin(i * 1.7) + 1) * 0.16;

    let value = normalizeAudioValue(raw * boost * variation, sensitivity, 0.9);

    if (i < 6) {
      value = Math.min(value, 0.82);
    } else if (i < 20) {
      value = Math.min(value, 0.88);
    } else {
      value = Math.min(value, 0.94);
    }

    bars.push(value);
  }

  return {
    bass,
    mid,
    high,
    master,
    bars
  };
}

function applyVisualizerData(visualizerData) {
  const stage = document.getElementById('stage');
  const bars = document.querySelectorAll('.bar');

  const bass = clampLevel(visualizerData?.bass);
  const mid = clampLevel(visualizerData?.mid);
  const high = clampLevel(visualizerData?.high);
  const master = clampLevel(visualizerData?.master);
  const barValues = Array.isArray(visualizerData?.bars) ? visualizerData.bars : [];

  stage.style.setProperty('--bass', bass);
  stage.style.setProperty('--mid', mid);
  stage.style.setProperty('--high', high);
  stage.style.setProperty('--master', master);

  bars.forEach((bar, index) => {
    bar.style.setProperty('--bar-level', clampLevel(barValues[index]));
  });
}

function startVideoVisualizerLevelLoop() {
  if (!videoAnalyser || !videoAnalyserDataArray) return;

  if (videoVisualizerAnimationId) {
    cancelAnimationFrame(videoVisualizerAnimationId);
  }

  const update = () => {
    videoAnalyser.getByteFrequencyData(videoAnalyserDataArray);

    if (visualizerEnabled) {
  const visualizerData = createVisualizerData(videoAnalyserDataArray);
  applyVisualizerData(visualizerData);
}

    videoVisualizerAnimationId = requestAnimationFrame(update);
  };

  update();
}

function stopVideoVisualizerLevelLoop() {
  if (videoVisualizerAnimationId) {
    cancelAnimationFrame(videoVisualizerAnimationId);
    videoVisualizerAnimationId = null;
  }

  const stage = document.getElementById('stage');
  const bars = document.querySelectorAll('.bar');

  stage.style.setProperty('--bass', 0);
  stage.style.setProperty('--mid', 0);
  stage.style.setProperty('--high', 0);
  stage.style.setProperty('--master', 0);

  bars.forEach(bar => {
    bar.style.setProperty('--bar-level', 0);
  });
}


let visualizerEnabled = true;

function setVisualizerEnabled(enabled) {
  visualizerEnabled = Boolean(enabled);

  const stage = document.getElementById('stage');

  if (visualizerEnabled) {
    stage.classList.remove('visualizer-off');
  } else {
    stage.classList.add('visualizer-off');

    stage.style.setProperty('--bass', 0);
    stage.style.setProperty('--mid', 0);
    stage.style.setProperty('--high', 0);
    stage.style.setProperty('--master', 0);

    document.querySelectorAll('.bar').forEach(bar => {
      bar.style.setProperty('--bar-level', 0);
    });
  }
}

ipcRenderer.on('visualizer-enabled', (event, enabled) => {
  setVisualizerEnabled(enabled);
});

ipcRenderer.on('visualizer-brand-name', (event, brandName) => {
  const brand = document.getElementById('brand');

  const safeBrandName = String(brandName || '').trim() || 'PARADOX VISUALIZER';

  brand.textContent = safeBrandName;
});


const TEMPLATE_CLASS_NAMES = [
  'template-standard',
  'template-neon-circle',
  'template-minimal',
  'template-lyric-focus',
  'template-dark-club'
];

function setVisualizerTemplate(templateName) {
  const stage = document.getElementById('stage');

  TEMPLATE_CLASS_NAMES.forEach(className => {
    stage.classList.remove(className);
  });

  const safeTemplateName = String(templateName || 'standard').trim();

  if (safeTemplateName === 'neon-circle') {
    stage.classList.add('template-neon-circle');
  } else if (safeTemplateName === 'minimal') {
    stage.classList.add('template-minimal');
  } else if (safeTemplateName === 'lyric-focus') {
    stage.classList.add('template-lyric-focus');
  } else if (safeTemplateName === 'dark-club') {
    stage.classList.add('template-dark-club');
  } else {
    stage.classList.add('template-standard');
  }
}

ipcRenderer.on('visualizer-template', (event, templateName) => {
  setVisualizerTemplate(templateName);
});

let videoAudioContext = null;
let videoAnalyser = null;
let videoSourceNode = null;
let videoAnalyserDataArray = null;
let videoVisualizerAnimationId = null;
</script>
