<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PARADOX Visualizer</title>
<link rel="stylesheet" href="./visualizer.css">
<link rel="stylesheet" href="./themes/aurora/aurora.css">


</head>


<body>
  <div id="stage" class="template-standard">
    <img id="bgImage" src="">

<div id="auroraStarsLayer">
  <span style="--x:12%; --y:10%; --s:1.2; --d:0s;   --t:22s;"></span>
  <span style="--x:28%; --y:18%; --s:0.8; --d:1.4s; --t:16s;"></span>
  <span style="--x:44%; --y:8%;  --s:1.0; --d:2.1s; --t:27s;"></span>
  <span style="--x:63%; --y:15%; --s:1.4; --d:0.7s; --t:19s;"></span>
  <span style="--x:82%; --y:11%; --s:0.9; --d:1.9s; --t:24s;"></span>
  <span style="--x:18%; --y:32%; --s:1.0; --d:2.8s; --t:30s;"></span>
  <span style="--x:36%; --y:27%; --s:1.3; --d:0.9s; --t:18s;"></span>
  <span style="--x:57%; --y:34%; --s:0.7; --d:3.2s; --t:26s;"></span>
  <span style="--x:76%; --y:28%; --s:1.1; --d:1.1s; --t:21s;"></span>
</div>

<div id="auroraFogLayer"></div>

<div id="auroraFrontDustLayer">
  <span style="--x:22%; --y:42%; --s:1.0; --d:0s;"></span>
  <span style="--x:68%; --y:36%; --s:1.3; --d:1.2s;"></span>
  <span style="--x:31%; --y:58%; --s:0.8; --d:2.4s;"></span>
  <span style="--x:78%; --y:54%; --s:1.1; --d:0.8s;"></span>
  <span style="--x:48%; --y:31%; --s:0.7; --d:3.1s;"></span>
  <span style="--x:57%; --y:66%; --s:1.2; --d:1.8s;"></span>
</div>


  <canvas id="glslLayer"></canvas>

  <video id="bgVideo" playsinline></video>
  
  <div id="bgOverlay"></div>
  <canvas id="spectrumCanvas"></canvas>

<div id="visualizerCanvas">
  <div id="lyricsLayer">
    <div id="lyricsCanvas">
      <div id="lyricsBlocksLayer"></div>
    </div>
  </div>
</div>

  <div id="overlayLayers"></div>
  

  <div id="brand">VISUALIZER</div>

    <div id="ringBurst"></div>
<div id="circleAura"></div>
<div id="visualCircle"></div>

    <div id="bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>


<div id="coverFrame">
  <img id="coverImage" src="">
</div>
      
        <div id="songInfo">
  <div class="songLine"></div>
  <div id="title"></div>
  <div id="artist"></div>

  <div id="timeInfo">
    <span id="currentTime">00:00</span>
    <span class="timeDivider"> / </span>
    <span id="durationTime">00:00</span>
  </div>

  <div class="songLine bottomLine"></div>
</div>

  

    <div id="bandLabels">
      <span>LOW</span>
      <span>MID</span>
      <span>HIGH</span>
    </div>
  </div>

  

<script src="./glsl/shaders.js"></script>
<script src="./glsl/auroraShader.js"></script>
<script src="./glsl/engine.js"></script>
<script src="./particles/bubbleParticle.js"></script>
<script src="./particles/starDustParticle.js"></script>
<script src="./particles/shootingStarParticle.js"></script>
<script src="./particles/auroraParticle.js"></script>
<script src="./particles/particleEngine.js"></script>
<script src="./LyricsRenderer.js"></script>
<script src="./LyricsAnimationEngine.js"></script>
<script src="./visualizer.js"></script>
</body>
</html>
