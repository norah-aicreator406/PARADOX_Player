<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PARADOX Player</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: system-ui, sans-serif;
  padding: 0 24px 24px;
}

h1 {
  margin: 0;
  font-size: 28px;
}

#fixedHeader {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(17, 17, 17, 0.96);
  backdrop-filter: blur(10px);
  padding: 18px 0 14px;
  border-bottom: 1px solid #333;
}

#playerPanel {
  margin-top: 8px;
  padding: 10px;
  border-radius: 12px;
  background: #222;
}

#nowPlayingLabel {
  display: none;
}

#nowPlaying {
  color: #00ffcc;
  font-size: 15px;
  font-weight: bold;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#playerButtons {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}

#queueFloatingWindow {
  display: none;
  position: fixed;
  top: 160px;
  left: 80px;
  width: 420px;
  max-width: calc(100vw - 40px);
  z-index: 3000;
  background: #181818;
  border: 1px solid #333;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  overflow: hidden;
}

#queueFloatingWindow.show {
  display: block;
}

#queueFloatingHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #222;
  padding: 10px 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: move;
  user-select: none;
}

#queueCloseBtn {
  background: #333;
  color: #fff;
  padding: 4px 10px;
  font-size: 14px;
}

#queueList {
  padding: 12px;
}

.queueItem {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  font-size: 14px;
  border-bottom: 1px solid #2a2a2a;
}

.queueItem:last-child {
  border-bottom: none;
}

.queueItemText {
  cursor: pointer;
  flex: 1;
}

.queueItemText:hover {
  color: #00ffcc;
}

.queueRemove {
  background: #d63031;
  color: #fff;
  padding: 6px 10px;
  font-size: 12px;
}

#queueModalOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: rgba(0, 0, 0, 0.55);
}

#queueModalOverlay.show {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 120px;
}

#queueModal {
  width: min(620px, calc(100vw - 40px));
  max-height: 70vh;
  overflow-y: auto;
  background: #181818;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.55);
}

#queueModalHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  font-size: 18px;
  font-weight: bold;
}

#queueCloseBtn {
  background: #333;
  color: #fff;
  padding: 6px 12px;
  font-size: 16px;
}

.queueItem {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  font-size: 15px;
  border-bottom: 1px solid #2a2a2a;
}

.queueItem:last-child {
  border-bottom: none;
}

.queueItemText {
  cursor: pointer;
  flex: 1;
}

.queueItemText:hover {
  color: #00ffcc;
}

.queueRemove {
  background: #d63031;
  color: #fff;
  padding: 6px 10px;
  font-size: 12px;
}

.queueItem {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  font-size: 14px;
  border-bottom: 1px solid #2a2a2a;
}

.queueItem:last-child {
  border-bottom: none;
}

.queueRemove {
  background: #d63031;
  color: #fff;
  padding: 6px 10px;
  font-size: 12px;
}

#searchInput {
  width: 100%;
  box-sizing: border-box;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  background: #222;
  color: #fff;
}

.tabs {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  overflow-x: auto;
}

.tab {
  padding: 8px 14px;
  border: none;
  border-radius: 999px;
  background: #333;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}

.tab.active {
  background: #fff;
  color: #111;
  font-weight: bold;
}

.song {
  background: #1f1f1f;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
}

.song.playing {
  border: 2px solid #00ffcc;
  background: #162622;
}

.title {
  font-size: 20px;
  margin-bottom: 12px;
}

.buttons {
  display: flex;
  gap: 10px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 14px;
  cursor: pointer;
}

.play {
  background: #00b894;
  color: #fff;
}

.copy {
  background: #6c5ce7;
  color: #fff;
}

.stop {
  background: #d63031;
  color: #fff;
}

.nav {
  background: #0984e3;
  color: #fff;
}

.reload {
  background: #636e72;
  color: #fff;
}

audio {
  width: 100%;
  margin-top: 8px;
  height: 32px;
}
</style>
</head>

<body>

<div id="fixedHeader">
  <h1>PARADOX PLAYER</h1>

  <div id="playerPanel">
    <div id="nowPlayingLabel">再生中</div>
    <div id="nowPlaying">再生待機中</div>

    <div id="playerButtons">
      <button class="nav" onclick="playPrevious()">⏮ 前</button>
      <button class="stop" onclick="stopAudio()">⏹ 停止</button>
      <button class="nav" onclick="playNext()">⏭ 次</button>
      <button class="copy" onclick="copyCurrent()">📋 再生中をコピー</button>
      <button class="nav" onclick="openQueueModal()">予約リスト</button>
      <button class="reload" onclick="loadSheet()">再読込</button>
    </div>

    <audio id="audio" controls></audio>
  </div>

  <input
    id="searchInput"
    type="text"
    placeholder="曲名・アーティスト名で検索"
    oninput="renderSongs(currentIndex)"
  >
  <div class="tabs" id="tabs"></div>
</div>


<div id="songs"></div>

<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQNKyegX34VNuejAAc8Er5XwH7jXwalfUtpvlKKmqrLdLJmMun9dHKqHuqskSxfQzUfItpNYittGj_6/pub?gid=0&single=true&output=csv';

const { ipcRenderer } = require('electron');

let data = [];
let currentIndex = 0;
let currentSong = null;
let queue = [];
let currentFilteredSongs = [];
let currentFilteredSongIndex = -1;

const audio = document.getElementById('audio');
audio.addEventListener('ended', () => {
  if (queue.length === 0) return;

  const nextSong = queue.shift();

  renderQueue();
  renderSongs(currentIndex);

  playSong(nextSong, -1);
});
let isDraggingQueue = false;
let queueOffsetX = 0;
let queueOffsetY = 0;

window.addEventListener('DOMContentLoaded', () => {
  const queueWindow = document.getElementById('queueFloatingWindow');
  const queueHeader = document.getElementById('queueFloatingHeader');

  queueHeader.addEventListener('mousedown', (event) => {
    isDraggingQueue = true;
    queueOffsetX = event.clientX - queueWindow.offsetLeft;
    queueOffsetY = event.clientY - queueWindow.offsetTop;
  });

  document.addEventListener('mousemove', (event) => {
    if (!isDraggingQueue) return;

    queueWindow.style.left = `${event.clientX - queueOffsetX}px`;
    queueWindow.style.top = `${event.clientY - queueOffsetY}px`;
  });

  document.addEventListener('mouseup', () => {
    isDraggingQueue = false;
  });
});

loadSheet();

async function loadSheet() {
  try {
    document.getElementById('nowPlaying').textContent = 'スプレッドシート読込中...';

    const response = await fetch(SHEET_CSV_URL + '&cache=' + Date.now());
    const csvText = await response.text();

    data = parseSheetCsv(csvText);
    await checkAllAudioFiles();
    async function checkAllAudioFiles() {
  for (const artistData of data) {
    for (const song of artistData.songs) {
      const audioPath = await ipcRenderer.invoke(
        'find-audio-file',
        song.artist,
        song.title
      );

      song.hasAudio = !!audioPath;
    }
  }
}

    currentIndex = 0;
    currentSong = null;
    currentFilteredSongIndex = -1;

    renderTabs();
    renderSongs(0);
    renderQueue();

    document.getElementById('nowPlaying').textContent = '再生待機中';
  } catch (error) {
    alert('スプレッドシートを読み込めませんでした: ' + error.message);
    document.getElementById('nowPlaying').textContent = '読込失敗';
  }
}

function parseSheetCsv(csvText) {
  const rows = parseCsv(csvText);
  if (rows.length === 0) return [];

  const artists = rows[0].map(name => name.trim());
  const result = [];

  artists.forEach((artist, colIndex) => {
    if (!artist) return;

    const songs = [];

    for (let rowIndex = 1; rowIndex < rows.length; rowIndex++) {
      const title = rows[rowIndex][colIndex];

      if (title && title.trim()) {
        songs.push({
  artist,
  title: title.trim(),
  filePath: `${artist}/${title.trim()}`,
  hasAudio: false
});
      }
    }

    result.push({ artist, songs });
  });

  return result;
}

function parseCsv(text) {
  const rows = [];
  let row = [];
  let cell = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const nextChar = text[i + 1];

    if (char === '"' && inQuotes && nextChar === '"') {
      cell += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === ',' && !inQuotes) {
      row.push(cell);
      cell = '';
    } else if ((char === '\n' || char === '\r') && !inQuotes) {
      if (char === '\r' && nextChar === '\n') i++;
      row.push(cell);
      rows.push(row);
      row = [];
      cell = '';
    } else {
      cell += char;
    }
  }

  row.push(cell);
  rows.push(row);

  return rows.filter(r => r.some(c => c.trim() !== ''));
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';

  data.forEach((item, index) => {
    const button = document.createElement('button');
    button.className = 'tab' + (index === currentIndex ? ' active' : '');
    button.textContent = `${item.artist} (${item.songs.length})`;

    button.onclick = () => {
      currentIndex = index;
      renderTabs();
      renderSongs(index);
    };

    tabs.appendChild(button);
  });
}

function renderSongs(index) {
  const container = document.getElementById('songs');
  container.innerHTML = '';

  if (!data[index]) {
    container.innerHTML = '<p>データがありません。</p>';
    return;
  }

  const keyword = document
  .getElementById('searchInput')
  .value
  .trim()
  .toLowerCase();

if (keyword) {

  currentFilteredSongs = [];

  data.forEach(artistData => {

    artistData.songs.forEach(song => {

      const text =
        `${song.title} ${song.artist}`
        .toLowerCase();

      if (text.includes(keyword)) {
        currentFilteredSongs.push(song);
      }

    });

  });

} else {

  currentFilteredSongs =
    data[index].songs;

}

  if (currentFilteredSongs.length === 0) {
    container.innerHTML = '<p>該当する曲がありません。</p>';
    return;
  }

  currentFilteredSongs.forEach((song, songIndex) => {
    const text = `♫${song.title} - ${song.artist}`;

    const card = document.createElement('div');
    card.className = 'song';

    if (currentSong && currentSong.title === song.title && currentSong.artist === song.artist) {
      card.classList.add('playing');
      currentFilteredSongIndex = songIndex;
    }

   const icon = song.hasAudio ? '🟢' : '⚪';

const title = document.createElement('div');
title.className = 'title';
title.textContent = `${icon} ${text}`;

    const buttons = document.createElement('div');
    buttons.className = 'buttons';

    const playBtn = document.createElement('button');
    playBtn.className = 'play';
    playBtn.textContent = '▶ 再生';

    playBtn.onclick = () => {
      playSong(song, songIndex);
    };

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy';
    copyBtn.textContent = '📋 コピー';

    copyBtn.onclick = async () => {
      await ipcRenderer.invoke('copy-text', text);
      copyBtn.textContent = 'コピーしました';
      setTimeout(() => copyBtn.textContent = '📋 コピー', 1000);
    };

const reserveBtn = document.createElement('button');
reserveBtn.className = 'nav';
reserveBtn.textContent = '➕ 予約';

reserveBtn.onclick = () => {
  addToQueue(song);
};

    buttons.appendChild(playBtn);
    buttons.appendChild(copyBtn);
    buttons.appendChild(reserveBtn);

    card.appendChild(title);
    card.appendChild(buttons);
    container.appendChild(card);
  });
}

async function playSong(song, songIndex) {
  const text = `♫${song.title} - ${song.artist}`;

  const audioPath = await ipcRenderer.invoke('find-audio-file', song.artist, song.title);

  if (!audioPath) {
    alert('音源ファイルが見つかりませんでした。');
    return;
  }

  audio.src = 'file://' + audioPath;

  audio.play().catch(error => {
    alert('再生できませんでした: ' + error.message);
  });

  currentSong = song;
  currentFilteredSongIndex = songIndex;

  document.getElementById('nowPlaying').textContent = text;

  await ipcRenderer.invoke('copy-text', text);

  renderSongs(currentIndex);
}

function stopAudio() {
  audio.pause();
  audio.currentTime = 0;
}

function playPrevious() {
  if (currentFilteredSongs.length === 0) return;

  const prevIndex =
    currentFilteredSongIndex > 0
      ? currentFilteredSongIndex - 1
      : currentFilteredSongs.length - 1;

  playSong(currentFilteredSongs[prevIndex], prevIndex);
}

function playNext() {
  if (currentFilteredSongs.length === 0) return;

  const nextIndex =
    currentFilteredSongIndex < currentFilteredSongs.length - 1
      ? currentFilteredSongIndex + 1
      : 0;

  playSong(currentFilteredSongs[nextIndex], nextIndex);
}

async function copyCurrent() {
  if (!currentSong) {
    alert('まだ曲が再生されていません。');
    return;
  }

  const text = `♫${currentSong.title} - ${currentSong.artist}`;
  await ipcRenderer.invoke('copy-text', text);
}

function addToQueue(song) {
  if (queue.length >= 4) {
    alert('予約キューは最大4曲までです。');
    return;
  }

  const exists = queue.some(
    item => item.artist === song.artist && item.title === song.title
  );

  if (exists) {
    alert('この曲はすでに予約されています。');
    return;
  }

  queue.push(song);
  renderQueue();
  renderSongs(currentIndex);
  openQueueModal();
}

function removeFromQueue(index) {
  queue.splice(index, 1);
  renderQueue();
  renderSongs(currentIndex);
}
function renderQueue() {
  const queueList = document.getElementById('queueList');
  queueList.innerHTML = '';

  for (let i = 0; i < 4; i++) {
    const item = queue[i];

    const row = document.createElement('div');
    row.className = 'queueItem';

    const label = document.createElement('div');

    if (item) {
      label.textContent = `${i + 1}. ♫${item.title} - ${item.artist}`;
      label.className = 'queueItemText';

      label.onclick = () => {
        const selectedSong = queue.splice(i, 1)[0];
        renderQueue();
        playSong(selectedSong, -1);
      };
    } else {
      label.textContent = `${i + 1}. 空き`;
      label.style.color = '#666';
    }

    row.appendChild(label);

    if (item) {
      const removeBtn = document.createElement('button');
      removeBtn.className = 'queueRemove';
      removeBtn.textContent = '解除';
      removeBtn.onclick = () => removeFromQueue(i);

      row.appendChild(removeBtn);
    }

    queueList.appendChild(row);
  }
}

function openQueueModal() {
  const win = document.getElementById('queueFloatingWindow');

  if (!win) {
    alert('queueFloatingWindow が見つかりません');
    return;
  }

  win.classList.add('show');
  renderQueue();
}

function closeQueueWindow() {
  document.getElementById('queueFloatingWindow').classList.remove('show');
}

</script>

<div id="queueFloatingWindow">
  <div id="queueFloatingHeader">
    <span>予約キュー</span>
    <button id="queueCloseBtn" onclick="closeQueueWindow()">×</button>
  </div>

  <div id="queueList"></div>
</div>

</body>
</html>
