<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PARADOX Player</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: system-ui, sans-serif;
  padding: 0 24px 24px;
}

h1 {
  margin: 0;
  font-size: 28px;
}

#fixedHeader {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(17, 17, 17, 0.96);
  backdrop-filter: blur(10px);
  padding: 18px 0 14px;
  border-bottom: 1px solid #333;
}

#playerPanel {
  margin-top: 8px;
  padding: 10px;
  border-radius: 12px;
  background: #222;
}

#nowPlayingLabel {
  display: none;
}

#nowPlaying {
  color: #00ffcc;
  font-size: 15px;
  font-weight: bold;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#playerButtons {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}

#queueFloatingWindow {
  display: none;
  position: fixed;
  top: 160px;
  left: 80px;
  width: 420px;
  max-width: calc(100vw - 40px);
  z-index: 3000;
  background: #181818;
  border: 1px solid #333;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  overflow: hidden;
}

#queueFloatingWindow.show {
  display: block;
}

#queueFloatingHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #222;
  padding: 10px 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: move;
  user-select: none;
}

#queueCloseBtn {
  background: #333;
  color: #fff;
  padding: 4px 10px;
  font-size: 14px;
}

#queueList {
  padding: 12px;
}

.queueItem {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  font-size: 14px;
  border-bottom: 1px solid #2a2a2a;
}

.queueItem:last-child {
  border-bottom: none;
}

.queueItemText {
  cursor: pointer;
  flex: 1;
}

.queueItemText:hover {
  color: #00ffcc;
}

.queueRemove {
  background: #d63031;
  color: #fff;
  padding: 6px 10px;
  font-size: 12px;
}

#queueModalOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: rgba(0, 0, 0, 0.55);
}

#queueModalOverlay.show {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 120px;
}

#queueModal {
  width: min(620px, calc(100vw - 40px));
  max-height: 70vh;
  overflow-y: auto;
  background: #181818;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.55);
}

#queueModalHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  font-size: 18px;
  font-weight: bold;
}

#queueCloseBtn {
  background: #333;
  color: #fff;
  padding: 6px 12px;
  font-size: 16px;
}

.queueItem {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  font-size: 15px;
  border-bottom: 1px solid #2a2a2a;
}

.queueItem:last-child {
  border-bottom: none;
}

.queueItemText {
  cursor: pointer;
  flex: 1;
}

.queueItemText:hover {
  color: #00ffcc;
}

.queueRemove {
  background: #d63031;
  color: #fff;
  padding: 6px 10px;
  font-size: 12px;
}

.queueItem {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  font-size: 14px;
  border-bottom: 1px solid #2a2a2a;
}

.queueItem:last-child {
  border-bottom: none;
}

.queueRemove {
  background: #d63031;
  color: #fff;
  padding: 6px 10px;
  font-size: 12px;
}

#searchInput {
  width: 100%;
  box-sizing: border-box;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  background: #222;
  color: #fff;
}

.tabs {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  overflow-x: auto;
}

.tab {
  padding: 8px 14px;
  border: none;
  border-radius: 999px;
  background: #333;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}

.tab.active {
  background: #fff;
  color: #111;
  font-weight: bold;
}

.song {
  background: #1f1f1f;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
}

.song.playing {
  border: 2px solid #00ffcc;
  background: #162622;
}

.title {
  font-size: 20px;
  margin-bottom: 12px;
}

.buttons {
  display: flex;
  gap: 10px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 14px;
  cursor: pointer;
}

.play {
  background: #00b894;
  color: #fff;
}

.copy {
  background: #6c5ce7;
  color: #fff;
}

.stop {
  background: #d63031;
  color: #fff;
}

.nav {
  background: #0984e3;
  color: #fff;
}

.reload {
  background: #636e72;
  color: #fff;
}

audio {
  width: 100%;
  margin-top: 8px;
  height: 32px;
}

.tab.dragging {
  opacity: 0.45;
}

.tab {
  user-select: none;
}
.tab {
  user-select: none;
  cursor: grab;
}

.tab:active {
  cursor: grabbing;
}

.tab.dragging {
  opacity: 0.45;
  transform: scale(0.96);
}

.tab.drag-over {
  outline: 2px solid #00ffcc;
  outline-offset: 2px;
}

#randomPanel {
  display: none;
  margin-top: 10px;
  padding: 12px;
  border-radius: 12px;
  background: #181818;
  border: 1px solid #333;
}

#randomPanel.show {
  display: block;
}

.randomTitle {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
  color: #00ffcc;
}

#randomArtistList {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.randomArtistItem {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  background: #2a2a2a;
  border-radius: 999px;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
}

.randomArtistItem input {
  cursor: pointer;
}

.randomButtons {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
</style>
</head>

<body>

<div id="fixedHeader">
  <h1>PARADOX PLAYER</h1>

  <div id="playerPanel">
    <div id="nowPlayingLabel">再生中</div>
    <div id="nowPlaying">再生待機中</div>

    <div id="playerButtons">
      <button class="nav" onclick="playPrevious()">⏮ 前</button>
      <button class="stop" onclick="stopAudio()">⏹ 停止</button>
      <button class="nav" onclick="playNext()">⏭ 次</button>
      <button class="copy" onclick="copyCurrent()">📋 再生中をコピー</button>
      <button class="nav" onclick="openQueueModal()">予約リスト</button>
      <button class="nav" onclick="toggleRandomPanel()">🎲 ランダム予約</button>
      <button class="reload" onclick="loadSongs()">曲リスト更新</button>
      
    </div>

    <audio id="audio" controls></audio>
    <div id="randomPanel">
  <div class="randomTitle">ランダム予約：除外するアーティスト</div>
  <div id="randomArtistList"></div>

  <div class="randomButtons">
    <button class="nav" onclick="randomReserve()">🎲 ランダムで予約</button>
    <button class="stop" onclick="clearRandomExclusions()">除外解除</button>
  </div>
</div>
  </div>

  <input
    id="searchInput"
    type="text"
    placeholder="曲名・アーティスト名で検索"
    oninput="renderSongs(currentIndex)"
  >
  <div class="tabs" id="tabs"></div>
</div>


<div id="songs"></div>

<script>
const { ipcRenderer } = require('electron');

let data = [];
let currentIndex = 0;
let currentSong = null;
let queue = [];
let currentFilteredSongs = [];
let currentFilteredSongIndex = -1;
const MAX_QUEUE = 5;

const audio = document.getElementById('audio');

audio.addEventListener('ended', () => {
  if (queue.length === 0) return;

  const nextSong = queue.shift();

  renderQueue();
  renderSongs(currentIndex);

  playSong(nextSong, -1);
});

let isDraggingQueue = false;
let queueOffsetX = 0;
let queueOffsetY = 0;

window.addEventListener('DOMContentLoaded', () => {
  const queueWindow = document.getElementById('queueFloatingWindow');
  const queueHeader = document.getElementById('queueFloatingHeader');

  if (queueWindow && queueHeader) {
    queueHeader.addEventListener('mousedown', (event) => {
      isDraggingQueue = true;
      queueOffsetX = event.clientX - queueWindow.offsetLeft;
      queueOffsetY = event.clientY - queueWindow.offsetTop;
    });

    document.addEventListener('mousemove', (event) => {
      if (!isDraggingQueue) return;

      queueWindow.style.left = `${event.clientX - queueOffsetX}px`;
      queueWindow.style.top = `${event.clientY - queueOffsetY}px`;
    });

    document.addEventListener('mouseup', () => {
      isDraggingQueue = false;
    });
  }

  loadSongs();
});

async function loadSongs() {
  try {
    document.getElementById('nowPlaying').textContent = 'musicフォルダ読込中...';

    data = await ipcRenderer.invoke('get-songs');

    applySavedArtistOrder();

    currentIndex = 0;
    currentSong = null;
    currentFilteredSongIndex = -1;
    currentFilteredSongs = [];

    renderTabs();
    renderSongs(0);
    renderQueue();
    renderRandomPanel();

    document.getElementById('nowPlaying').textContent = '再生待機中';
  } catch (error) {
    alert('musicフォルダを読み込めませんでした: ' + error.message);
    document.getElementById('nowPlaying').textContent = '読込失敗';
  }
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';

  data.forEach((item, index) => {
    const button = document.createElement('button');
    button.className = 'tab' + (index === currentIndex ? ' active' : '');
    button.textContent = `${item.artist} (${item.songs.length})`;

    button.draggable = true;
    button.dataset.index = index;

    button.onclick = () => {
      currentIndex = index;
      renderTabs();
      renderSongs(index);
    };

    button.addEventListener('dragstart', (event) => {
      event.dataTransfer.setData('text/plain', index);
      button.classList.add('dragging');
    });

    button.addEventListener('dragend', () => {
      button.classList.remove('dragging');
    });

    button.addEventListener('dragover', (event) => {
  event.preventDefault();
  button.classList.add('drag-over');
});

button.addEventListener('dragleave', () => {
  button.classList.remove('drag-over');
});

    button.addEventListener('drop', (event) => {
      event.preventDefault();
      button.classList.remove('drag-over');

      const fromIndex = Number(event.dataTransfer.getData('text/plain'));
      const toIndex = index;

      if (fromIndex === toIndex) return;

      moveArtistTab(fromIndex, toIndex);
    });

    tabs.appendChild(button);
  });
}
function moveArtistTab(fromIndex, toIndex) {
  const movedItem = data.splice(fromIndex, 1)[0];
  data.splice(toIndex, 0, movedItem);

  if (currentIndex === fromIndex) {
    currentIndex = toIndex;
  } else if (fromIndex < currentIndex && toIndex >= currentIndex) {
    currentIndex--;
  } else if (fromIndex > currentIndex && toIndex <= currentIndex) {
    currentIndex++;
  }

  saveArtistOrder();

  renderTabs();
  renderSongs(currentIndex);
}

function saveArtistOrder() {
  const artistOrder = data.map(item => item.artist);
  localStorage.setItem('paradoxArtistOrder', JSON.stringify(artistOrder));
}

function applySavedArtistOrder() {
  const saved = localStorage.getItem('paradoxArtistOrder');

  if (!saved) return;

  try {
    const artistOrder = JSON.parse(saved);

    data.sort((a, b) => {
      const indexA = artistOrder.indexOf(a.artist);
      const indexB = artistOrder.indexOf(b.artist);

      if (indexA !== -1 && indexB !== -1) {
        return indexA - indexB;
      }

      if (indexA !== -1) return -1;
      if (indexB !== -1) return 1;

      return a.artist.localeCompare(b.artist, 'ja');
    });
  } catch (error) {
    console.warn('タブ順の読み込みに失敗しました:', error);
  }
}

function renderSongs(index) {
  const container = document.getElementById('songs');
  container.innerHTML = '';

  if (!data[index]) {
    container.innerHTML = '<p>musicフォルダ内に曲がありません。</p>';
    currentFilteredSongs = [];
    return;
  }

  const keyword = document
    .getElementById('searchInput')
    .value
    .trim()
    .toLowerCase();

  if (keyword) {
    currentFilteredSongs = [];

    data.forEach(artistData => {
      artistData.songs.forEach(song => {
        const text = `${song.title} ${song.artist}`.toLowerCase();

        if (text.includes(keyword)) {
          currentFilteredSongs.push(song);
        }
      });
    });
  } else {
    currentFilteredSongs = data[index].songs;
  }

  if (currentFilteredSongs.length === 0) {
    container.innerHTML = '<p>該当する曲がありません。</p>';
    return;
  }

  currentFilteredSongs.forEach((song, songIndex) => {
    const text = `♫${song.title} - ${song.artist}`;

    const card = document.createElement('div');
    card.className = 'song';

    if (
      currentSong &&
      currentSong.title === song.title &&
      currentSong.artist === song.artist
    ) {
      card.classList.add('playing');
      currentFilteredSongIndex = songIndex;
    }

    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = text;

    const buttons = document.createElement('div');
    buttons.className = 'buttons';

    const playBtn = document.createElement('button');
    playBtn.className = 'play';
    playBtn.textContent = '▶ 再生';

    playBtn.onclick = () => {
      playSong(song, songIndex);
    };

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy';
    copyBtn.textContent = '📋 コピー';

    copyBtn.onclick = async () => {
      await ipcRenderer.invoke('copy-text', text);
      copyBtn.textContent = 'コピーしました';
      setTimeout(() => copyBtn.textContent = '📋 コピー', 1000);
    };

    const reserveBtn = document.createElement('button');
    reserveBtn.className = 'nav';
    reserveBtn.textContent = '➕ 予約';

    reserveBtn.onclick = () => {
      addToQueue(song);
    };

    buttons.appendChild(playBtn);
    buttons.appendChild(copyBtn);
    buttons.appendChild(reserveBtn);

    card.appendChild(title);
    card.appendChild(buttons);
    container.appendChild(card);
  });
}

async function playSong(song, songIndex) {
  const text = `♫${song.title} - ${song.artist}`;

  if (!song.fileUrl) {
    alert('音源ファイルのURLが取得できませんでした。');
    return;
  }

  audio.src = song.fileUrl;

  audio.play().catch(error => {
    alert('再生できませんでした: ' + error.message);
  });

  currentSong = song;
  currentFilteredSongIndex = songIndex;

  document.getElementById('nowPlaying').textContent = text;

  await ipcRenderer.invoke('copy-text', text);

  renderSongs(currentIndex);
}

function stopAudio() {
  audio.pause();
  audio.currentTime = 0;
}

function playPrevious() {
  if (currentFilteredSongs.length === 0) return;

  const prevIndex =
    currentFilteredSongIndex > 0
      ? currentFilteredSongIndex - 1
      : currentFilteredSongs.length - 1;

  playSong(currentFilteredSongs[prevIndex], prevIndex);
}

function playNext() {
  if (currentFilteredSongs.length === 0) return;

  const nextIndex =
    currentFilteredSongIndex < currentFilteredSongs.length - 1
      ? currentFilteredSongIndex + 1
      : 0;

  playSong(currentFilteredSongs[nextIndex], nextIndex);
}

async function copyCurrent() {
  if (!currentSong) {
    alert('まだ曲が再生されていません。');
    return;
  }

  const text = `♫${currentSong.title} - ${currentSong.artist}`;
  await ipcRenderer.invoke('copy-text', text);
}

function addToQueue(song) {
  if (queue.length >= MAX_QUEUE) {
  alert(`予約キューは最大${MAX_QUEUE}曲までです。`);
  return;
}

  const exists = queue.some(
    item => item.artist === song.artist && item.title === song.title
  );

  if (exists) {
    alert('この曲はすでに予約されています。');
    return;
  }

  queue.push(song);
  renderQueue();
  renderSongs(currentIndex);
  openQueueModal();
}

function removeFromQueue(index) {
  queue.splice(index, 1);
  renderQueue();
  renderSongs(currentIndex);
}

function renderQueue() {
  const queueList = document.getElementById('queueList');
  queueList.innerHTML = '';

  for (let i = 0; i < MAX_QUEUE; i++) {
    const item = queue[i];

    const row = document.createElement('div');
    row.className = 'queueItem';

    const label = document.createElement('div');

    if (item) {
      label.textContent = `${i + 1}. ♫${item.title} - ${item.artist}`;
      label.className = 'queueItemText';

      label.onclick = () => {
        const selectedSong = queue.splice(i, 1)[0];
        renderQueue();
        playSong(selectedSong, -1);
      };
    } else {
      label.textContent = `${i + 1}. 空き`;
      label.style.color = '#666';
    }

    row.appendChild(label);

    if (item) {
      const removeBtn = document.createElement('button');
      removeBtn.className = 'queueRemove';
      removeBtn.textContent = '解除';
      removeBtn.onclick = () => removeFromQueue(i);

      row.appendChild(removeBtn);
    }

    queueList.appendChild(row);
  }
}

function toggleRandomPanel() {
  const panel = document.getElementById('randomPanel');
  panel.classList.toggle('show');
  renderRandomPanel();
}

function renderRandomPanel() {
  const list = document.getElementById('randomArtistList');
  if (!list) return;

  list.innerHTML = '';

  const excludedArtists = getExcludedArtists();

  data.forEach(artistData => {
    const label = document.createElement('label');
    label.className = 'randomArtistItem';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = excludedArtists.includes(artistData.artist);

    checkbox.onchange = () => {
      const currentExcluded = getExcludedArtists();

      let nextExcluded;

      if (checkbox.checked) {
        nextExcluded = [...new Set([...currentExcluded, artistData.artist])];
      } else {
        nextExcluded = currentExcluded.filter(artist => artist !== artistData.artist);
      }

      localStorage.setItem('paradoxRandomExcludedArtists', JSON.stringify(nextExcluded));
    };

    const name = document.createElement('span');
    name.textContent = `${artistData.artist} (${artistData.songs.length})`;

    label.appendChild(checkbox);
    label.appendChild(name);

    list.appendChild(label);
  });
}

function getExcludedArtists() {
  const saved = localStorage.getItem('paradoxRandomExcludedArtists');

  if (!saved) return [];

  try {
    return JSON.parse(saved);
  } catch (error) {
    return [];
  }
}

function clearRandomExclusions() {
  localStorage.removeItem('paradoxRandomExcludedArtists');
  renderRandomPanel();
}

function randomReserve() {
  const remainingSlots = MAX_QUEUE - queue.length;

  if (remainingSlots <= 0) {
    alert(`予約キューはすでに最大${MAX_QUEUE}曲です。`);
    return;
  }

  const excludedArtists = getExcludedArtists();
  const alreadyQueuedArtists = queue.map(song => song.artist);

  const candidateArtists = data.filter(artistData => {
    if (excludedArtists.includes(artistData.artist)) return false;
    if (alreadyQueuedArtists.includes(artistData.artist)) return false;
    if (!artistData.songs || artistData.songs.length === 0) return false;

    return true;
  });

  if (candidateArtists.length === 0) {
    alert('ランダム予約できるアーティストがいません。');
    return;
  }

  const shuffledArtists = shuffleArray(candidateArtists);
  const selectedArtists = shuffledArtists.slice(0, remainingSlots);

  selectedArtists.forEach(artistData => {
    const randomSong = getRandomSong(artistData.songs);
    queue.push(randomSong);
  });

  renderQueue();
  renderSongs(currentIndex);
  openQueueModal();

  alert(`${selectedArtists.length}曲をランダム予約しました。`);
}

function getRandomSong(songs) {
  const index = Math.floor(Math.random() * songs.length);
  return songs[index];
}

function shuffleArray(array) {
  const copied = [...array];

  for (let i = copied.length - 1; i > 0; i--) {
    const randomIndex = Math.floor(Math.random() * (i + 1));
    const temporary = copied[i];

    copied[i] = copied[randomIndex];
    copied[randomIndex] = temporary;
  }

  return copied;
}

function openQueueModal() {
  const win = document.getElementById('queueFloatingWindow');

  if (!win) {
    alert('queueFloatingWindow が見つかりません');
    return;
  }

  win.classList.add('show');
  renderQueue();
}

function closeQueueWindow() {
  document.getElementById('queueFloatingWindow').classList.remove('show');
}

</script>

<div id="queueFloatingWindow">
  <div id="queueFloatingHeader">
    <span>予約キュー</span>
    <button id="queueCloseBtn" onclick="closeQueueWindow()">×</button>
  </div>

  <div id="queueList"></div>
</div>

</body>
</html>
