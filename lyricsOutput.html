<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NORAH Lyrics Output</title>

  <!-- Google Fonts -->
<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bebas+Neue&family=Creepster&family=Dela+Gothic+One&family=DotGothic16&family=Hachi+Maru+Pop&family=Kaisei+Decol:wght@400;500;700&family=Klee+One:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@100..900&family=Noto+Serif+JP:wght@400;500;600;700;900&family=Orbitron:wght@400..900&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:wght@400..900&family=Reggae+One&family=RocknRoll+One&family=Shippori+Mincho:wght@400;500;600;700;800&family=Yomogi&family=Yuji+Boku&family=Yuji+Mai&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Zen+Old+Mincho:wght@400;500;600;700;900&display=swap"
  rel="stylesheet"
>

  <!--
    歌詞のIN・HOLD・OUTアニメーション定義を共有
  -->
  <link
    rel="stylesheet"
    href="./visualizer.css"
  >

  <!-- Lyrics Output専用CSS -->
  <link
    rel="stylesheet"
    href="./lyricsOutput.css"
  >
</head>

<body>
  <header id="lyricsOutputToolbar">
    <div class="lyricsOutputDragArea">
      <span class="lyricsOutputToolbarIcon">
        T
      </span>

      <span class="lyricsOutputToolbarTitle">
        Lyrics Output
      </span>

      <span class="lyricsOutputToolbarHint">
        ここをドラッグして移動
      </span>
    </div>

    <div class="lyricsOutputWindowActions">
      <button
        id="lyricsOutputMinimizeButton"
        type="button"
        aria-label="最小化"
        title="最小化"
      >
        −
      </button>

      <button
        id="lyricsOutputCloseButton"
        type="button"
        aria-label="閉じる"
        title="閉じる"
      >
        ×
      </button>
    </div>
  </header>

  <main id="lyricsOutputStage">
    <div id="lyricsOutputCanvas">
      <div id="lyricsOutputBlocks"></div>

      <section
        id="lyricsOutputSongInfo"
        aria-hidden="true"
      >
        <div class="lyricsOutputSongLine"></div>

        <div id="lyricsOutputTitle"></div>

        <div id="lyricsOutputArtist"></div>

        <div id="lyricsOutputTime">
          <span id="lyricsOutputCurrentTime">
            00:00
          </span>

          <span class="lyricsOutputTimeDivider">
            /
          </span>

          <span id="lyricsOutputDuration">
            00:00
          </span>
        </div>

        <div
          class="lyricsOutputSongLine lyricsOutputBottomLine"
        ></div>
      </section>
    </div>
  </main>

  <script src="./LyricsRenderer.js"></script>
  <script src="./LyricsAnimationEngine.js"></script>
  <script src="./lyricsOutput.js"></script>
</body>
</html>
